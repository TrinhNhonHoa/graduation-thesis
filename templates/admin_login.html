<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập Quản Lý — FaceID</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="login-body">

  <div class="login-wrapper">
    
    <div class="login-card">
      <div class="login-brand">
        <div class="login-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h2>Hệ Thống Quản Lý</h2>
        <p>Đăng nhập tài khoản quản trị viên để quản lý nhân viên và lịch chấm công</p>
      </div>

      <form id="admin-login-form" class="login-form">
        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="username" name="username" placeholder="Nhập tài khoản (vd: admin)" required autofocus />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="input-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required />
          </div>
        </div>

        <div id="login-error" class="login-alert hidden"></div>

        <button type="submit" class="btn-primary btn-block" id="btn-submit-login">
          <span>Đăng Nhập Quản Trị</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>

        <div class="login-meta-tip">
          <p>Mặc định: tài khoản <code>admin</code> • mật khẩu <code>admin123</code></p>
        </div>
      </form>

      <div class="login-footer">
        <a href="/" class="btn-back-kiosk">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Quay lại màn hình Live Cam Kiosk
        </a>
      </div>
    </div>

  </div>

  <script>
    const form = document.getElementById('admin-login-form');
    const alertBox = document.getElementById('login-error');
    const btn = document.getElementById('btn-submit-login');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span>Đang xác thực...</span>';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          window.location.href = data.redirect || '/admin';
        } else {
          alertBox.textContent = data.error || 'Đăng nhập không thành công.';
          alertBox.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<span>Đăng Nhập Quản Trị</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
        }
      } catch (err) {
        alertBox.textContent = 'Lỗi kết nối tới máy chủ.';
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Đăng Nhập Quản Trị</span>';
      }
    });
  </script>
</body>
</html>
